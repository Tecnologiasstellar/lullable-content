  description: Slip into a provincial Roman bathhouse at the gentlest hour of its day, just as the crowds drift home and the attendants light the evening lamps. Walk the warm rooms in their proper order, stand on a floor heated by a fire nobody sees, and listen to water that has been arriving from the hills without pause for a hundred years. Along the way, the bronze strigil and the oil, Seneca's famous list of bathhouse noises, the spring in Britain where the earth itself stokes the furnace, and the banked fire that will breathe warmth under the mosaics all night long.
