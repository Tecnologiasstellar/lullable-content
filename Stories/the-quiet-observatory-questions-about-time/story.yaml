  description: 'You climb a small hill to a small observatory to spend the night with the gentlest big question there is: what is time. A telescope shows that starlight is an old patient archive, arriving from a hundred different pasts all at once, and that there is no single now shared by the whole universe. Pendulum clocks, water clocks, and candle clocks each try to hang a bucket in a stream that never pools. A carpenter''s son builds four clocks to solve longitude at sea, a hill at Greenwich becomes the world''s meridian, and modern clocks now count the hum inside an atom. At the end, the astronomer closes the logbook with one word, closed, and so can you.'
