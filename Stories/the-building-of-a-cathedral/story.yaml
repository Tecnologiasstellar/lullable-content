  description: Walk into a thirteenth-century city at dusk, where the largest unfinished thing in the world has been rising for sixty years and will not be done for eighty more. Visit the lodge where stone dust turns gold in the doorway light, and the plaster tracing floor where three generations of masters have scratched their thinking at full size. Learn why the pointed arch lets stone float, how a timber centering is struck and a vault suddenly holds itself, and why lime mortar sets the pace of the whole century. Then watch the site put itself to bed, wrapped in straw against the frost, still quietly turning back into stone in the dark.
