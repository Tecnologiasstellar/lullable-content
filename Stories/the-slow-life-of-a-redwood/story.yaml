  - gentle-nature
  bedtimeNote: The grove waters itself with fog while everyone sleeps, and has done for two thousand summers. Nothing in it moves faster than a slug, and nothing needs watching tonight.
  bestFor: Quieting a full mind
  sleepPace: Soft, green, ancient
  atmosphere: Foggy, hushed, deep green
  description: Walk into a coastal grove at dusk and stand at the foot of a tree over three hundred feet tall, wrapped in a foot of soft bark, older than the cathedrals. Follow one unbroken thread of water from the roots to the highest needle, and wait for the summer fog to roll in off the cold Pacific so the forest can water itself in the dark. Along the way, roots that graft into their neighbours and hold each other up, rings of trees standing where their elders stood, a ghost-white redwood fed by its family, and a garden of ferns and huckleberries growing a metre deep in the crown.
