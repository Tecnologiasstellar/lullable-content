  description: Behind an old abbey in Moravia, a friar named Gregor Mendel spends his evenings among the pea rows. We watch him open a bud with tweezers, brush pollen by hand, and tie a small bag over the flower. In winter he pours the seeds into dishes by lamplight and counts them, and a quiet pattern of three to one rises out of the numbers. We visit the warm glasshouse and the fuchsias, the little weather hut, and the humming bee house, before rain begins on the glass and the garden settles for the night.
