  description: Stand in a raked gravel courtyard at dawn and look up at a building with no nails in it. No screws, no brackets, nothing but wood cut to hold wood. Along the way, the joint that grips harder the more you load it, the carpenter who said to buy the mountain rather than the timber, a central pillar that holds up nothing and rests loose on a stone, and roof bark peeled from living trees that grow it back in ten years. And at Ise, a shrine rebuilt from new wood every twenty years for thirteen centuries, because twenty years is the length of human memory.
