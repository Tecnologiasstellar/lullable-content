  description: You cross a frozen street at two in the morning toward the one lit window on the corner, and step into a small tiled room that smells of warm flour. A baker works alone at a wooden bench, unhurried, feeding a glass jar that is older than she is. You learn what is living inside it, why the dough rests before it is touched, what the salt is quietly doing, and how a loaf lifts and sets and turns gold in the last half hour. Then the light goes off, and she walks home to sleep.
