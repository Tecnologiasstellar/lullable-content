  description: You walk the long way home down an Irish coast road at dusk, with the sea keeping pace on one side and stone walls built to let the wind through on the other. The road passes a small harbor of knocking boats, a bridge over a talking stream, and a sleeping village where lamplight goes window by window from white to amber to out. Soft rain arrives in the hedges, right on time. A lamp burns in a neighbor's window for late travelers, an old coastal custom, and at last a whitewashed house appears with its own window lit, its turf fire banked low and patient under its ash, waiting to be climbed into.
