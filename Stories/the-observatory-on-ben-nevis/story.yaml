  - cozy-tales
  bedtimeNote: Somebody is awake on a mountain, taking a reading on the hour, whether or not you are. The next one is not yours, and it will be taken anyway.
  bestFor: Letting go of the day
  sleepPace: Hourly and unhurried
  atmosphere: Cold, lamplit, patient
  description: You climb into the cloud that sits on the highest ground in Britain, and step through a low stone door into lamplight, a warm stove, and a kettle that is always on. For twenty-one years, somebody here walked out into the weather every hour of every night and wrote down what it was doing. You learn how a wet sleeve of muslin measures the dryness of the air, why the thermometer boxes had to be lifted as the snow came up to meet them, and how ice grows sideways into the wind. Then the lamp is turned low, a wet coat goes on the hook, and the mountain carries on without you.
