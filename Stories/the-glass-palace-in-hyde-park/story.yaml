  description: You arrive in Hyde Park before sunrise, in the spring of 1851, and walk toward a building made almost entirely of glass. Inside, full-grown elm trees stand under a great arched roof, a fountain of cut glass falls softly at the crossing, and sparrows sing in the iron. You learn how a gardener drew the whole thing on blotting paper, how nearly three hundred thousand panes were set from little trolleys that ran along the gutters, and who will come through the doors when they open. Then rain begins on the roof.
