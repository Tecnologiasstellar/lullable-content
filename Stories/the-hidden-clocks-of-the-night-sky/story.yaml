  description: 'You lie back in a dark meadow and read the oldest clock there is: the night sky. The whole dome of stars turns once a day around a quiet pole star. The moon counts twenty-nine nights and tows the tides behind it. Five wandering planets keep their own slow paces, one of them lending its name to Saturday. Starlight even comes in colors that tell a star''s age, blue youth to red old age. And beneath every quick hand, one wobble of the Earth''s axis takes twenty-six thousand years to complete, mid-tick since before the first cities rose. None of these clocks needs winding, watching, or you.'
