  description: Tonight we walk the length of a Roman aqueduct at dusk, from the spring at Uzès to the fountains of Nîmes. Fifty kilometers of channel, falling barely the width of a forearm in every kilometer, so gently that the slope cannot be seen or felt. We follow the water through buried channels lined in red waterproof mortar, through tunnels cut by lamplight, and across the three golden tiers of the Pont du Gard, where the fall is two and a half centimeters from one side to the other. Nothing hurries, and nothing in the whole long line has a single moving part.
