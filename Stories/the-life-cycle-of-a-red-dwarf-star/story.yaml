  - cosmic-journeys
  bedtimeNote: Not one red dwarf has ever run down. The universe is far too young. Every single one ever made is still quietly burning, and none of it needs watching tonight.
  bestFor: Unwinding without hurry
  sleepPace: Low, warm, unchanging
  atmosphere: Dim, orange, warm, endless
  description: Travel four light years to Proxima Centauri, a small orange star so dim you could look straight at it, and so ordinary that three quarters of the galaxy is made of stars like it. Inside, the whole body slowly turns itself over, which is why it will still be burning in ten trillion years. Along the way, why nature makes far more small stars than large ones, the women at Harvard who sorted the spectra by hand, the titanium chemistry that survives in a star's atmosphere, and the quiet fact that not one red dwarf anywhere has ever finished.
