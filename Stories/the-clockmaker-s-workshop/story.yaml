  description: Step through a door with a brass bell into a small-town shop where a hundred clocks tick softly out of step, like rain on a roof. At the bench, an unhurried craftsman tends a movement of polished wheels with tools that have not changed in two centuries. Learn what a clock really is, a falling weight let down slowly over a week, and why two clocks on the same wall drift into perfect step with each other, a mystery first noticed from a sickbed in 1665. With painted moon dials, a drawer of orphaned keys that all fit something somewhere, winding day, house calls taken over tea, and the repairers' names penciled inside case doors, a century apart.
