  description: We arrive in Delft by water at evening, pass the leaning tower and the market square, and climb the narrow stairs to an upstairs room where the light comes in from the left. There Johannes Vermeer works slowly on one canvas. We follow the blue from the mountains of Afghanistan to his palette, watch a picture built up in patient layers, and look closely at a milkmaid, a pearl, and the town seen from across the water at seven in the morning. Then the bells, the light going blue, and an empty studio.
